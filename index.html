<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>初等变换辅助学习</title>
    <link rel="stylesheet" href="./style/window-and-grid.css">
    <link rel="stylesheet" href="./style/base.css">
    <link rel="stylesheet" href="./style/components.css">
    <link rel="stylesheet" href="./style/popup.css">
    <link rel="stylesheet" href="./style/responsive.css">
    <link rel="stylesheet" href="./style/transformation.css">
    <link rel="stylesheet" href="./third-party-script/katex/katex.min.css">
    <link rel="stylesheet" href="./style/help.css">
</head>

<body>
    <header>
        <button id="ButtonInputMartix">录入矩阵</button>
        <button id="ButtonTest" class="hidden">调试按钮</button>
        <button id="ButtonTestCofirmPopup" class="hidden">调试确认弹窗按钮</button>
    </header>

    <!-- 更多按钮 -->
    <div class="more-container">
        <button id="moreButton" class="more-button">更多</button>
        <div id="moreDropdown" class="dropdown-menu">
            <button class="dropdown-title">导入导出功能</button>
            <button class="dropdown-item" id="exportMatrixButton">导出矩阵为二维数组</button>
            <button class="dropdown-item" id="ButtonQuickInput">导入二维数组为矩阵</button>
            <button class="dropdown-title">多项式功能</button>
            <button class="dropdown-item" id="ButtonForceSimplify">多项式展开</button>
            <button class="dropdown-item" id="ButtonForceFactorize">一元多项式因式分解</button>
            <button class="dropdown-item" id="ButtonReplaceElement">替换矩阵元素</button>
            <button class="dropdown-title">方阵特色功能</button>
            <button class="dropdown-item" id="ButtonComputeDiagonalProduct">计算对角线乘积</button>
            <button class="dropdown-item" id="ButtonCreateAugmentedIdentity">生成增广单位矩阵</button>
            <button class="dropdown-item" id="ButtonAddLamada">生成含λ的矩阵</button>
            <button class="dropdown-title">其他功能</button>
            <button class="dropdown-item" id="ButtonReset">重置矩阵</button>
            <button class="dropdown-item" id="ButtonToggleHelp">关闭帮助板块</button>
            <button class="dropdown-item" id="ButtonValidateFile">网页文件完整性验证</button>
            <a href="https://github.com/awei808/awei" class="dropdown-item" target="_blank">跳转GitHub仓库</a>
        </div>
    </div>
    <div id="InputMatrix" class="hidden">
        <h1 id="tip"></h1>
        <div>
            <div id="window"></div>
            <p id="coordinates">矩阵维度: 0×0</p>
            <p id="matrixDataDisplay" class="matrix-data-display" style="display: none;"></p>
        </div>
        <div class="assist-group">
            <button id="undoButton" class="action-button">上一步</button>
            <button id="nextButton" class="action-button">下一步</button>
        </div>
    </div>

    <div class="operator-buttons hidden">
        <div class="input-group">
            <div id="target" class="transform-group">
                <p>目标行/列：</p>
                <select id="transform-target" class="t-i-group">
                    <option value="row">无</option>
                </select>
            </div>
            <div id="arithmetic-symbols">
                <button id="button-change">↔</button>
                <button id="button-add">+</button>
                <button id="button-sub">−</button>
                <button id="button-mul">×</button>
            </div>
            <div id="coefficient" class="transform-group">
                <p>系数：</p>
                <input type="text" id="transform-coefficient" placeholder="默认为1">
            </div>
            <div id="param" class="transform-group">
                <p>参数行/列：</p>
                <select id="transform-param" class="t-i-group">
                    <option value="row">无</option>
                </select>
            </div>
            <button id="button-translate">执行初等变换</button>
        </div>
        <div class="transform-group flex-column">
            <p id="historyTransformation">初等变换历史记录：暂无</p>
            <div>
                <button id="button-undoTransformation">撤销初等变换</button>
                <button id="button-redoTransformation">重做初等变换</button>
            </div>
        </div>
    </div>

    <div id="result" class=" hidden">
    </div>

    <div id="help">
        <div id="contentbox">
            <h2>怎样开始使用本工具？</h2>
            <p>要有矩阵，才能使用，点击录入矩阵按钮录入需要变换的矩阵。</p>
            <p>完成录入后，再选择好初等变换数据，最后点击执行初等变换按钮，即可进行初等变换。</p>
            <p>点击两侧的箭头，可以切换帮助内容。</p>
        </div>
        <svg class="arrow" id="scroll-left" viewBox="0 0 24 24">
            <path d="M15 6l-6 6 6 6" />
        </svg>
        <svg class="arrow" id="scroll-right" viewBox="0 0 24 24">
            <path d="M9 6l6 6-6 6" />
        </svg>
    </div>

    <!-- 右下角弹窗容器 -->
    <div id="popupBox" class="popup-box-container"></div>
    <!-- 中心弹窗容器 -->
    <div id="popupCentreContainer" class="popup-centre-container"></div>

    <!-- 第三方库 -->
    <script src="./third-party-script/katex/katex.min.js"></script>
    <script src="./third-party-script/katex/contrib/auto-render.min.js"></script>
    <script src="./third-party-script/mathjs/math.js"></script>
    <script src="./third-party-script/nerdamer/nerdamer.core.js"></script>
    <script src="./third-party-script/nerdamer/Algebra.js"></script>
    <!-- 脚本 -->
    <script src="./script/config.js"></script>
    <script src="./script/main.js"></script>
    <script src="./script/popup.js"></script>
    <script src="./script/state.js"></script>
    <script src="./script/historyManager.js"></script>
    <script src="./script/vaildAndPreprocess.js"></script>
    <script src="./script/select-dimension.js"></script>
    <script src="./script/input-elements.js"></script>
    <script src="./script/elementary-transformation.js"></script>
    <script src="./script/transformation.js"></script>
    <script src="./script/HandlePolynomial.js"></script>
    <script src="./script/squareMatriSpecialFunctionx.js"></script>
    <script src="./script/help.js"></script>
    <script src="./script/test.js"></script>
    <script>
        // 网页文件完整性验证
        document.getElementById('ButtonValidateFile').addEventListener('click', () => {
            // 验证结果对象
            const validationResult = {
                domElements: [],
                scripts: [],
                styles: [],
                coreFunctions: [],
                overallStatus: 'success'
            };

            // 检查脚本文件
            const scriptSources = [
                './script/config.js', './script/main.js', './script/popup.js', './script/state.js',
                './script/historyManager.js', './script/VaildAndPreprocess.js', './script/select-dimension.js',
                './script/input-elements.js', './script/elementary-transformation.js', './script/transformation.js',
                './script/HandlePolynomial.js', './script/squareMatriSpecialFunctionx.js', './script/help.js',
                './script/test.js'
            ];

            scriptSources.forEach(src => {
                const script = document.querySelector(`script[src="${src}"]`);
                const status = script ? 'success' : 'error';
                validationResult.scripts.push({ src, status });
                if (status === 'error') validationResult.overallStatus = 'error';
            });

            // 检查样式文件
            const styleSources = [
                './style/window-and-grid.css', './style/base.css', './style/components.css',
                './style/popup.css', './style/responsive.css', './style/transformation.css',
                './third-party-script/katex/katex.min.css', './style/help.css'
            ];

            styleSources.forEach(href => {
                const link = document.querySelector(`link[href="${href}"]`);
                const status = link ? 'success' : 'error';
                validationResult.styles.push({ href, status });
                if (status === 'error') validationResult.overallStatus = 'error';
            });

            // 检查核心函数
            const coreFunctions = [
                'init', 'setupEventListeners', 'updateUIForCurrentState', 'Next', 'Undo',
                'saveCurrentState', 'createGrid', 'handleDimensionSelection', 'handleDataValidation',
                'showElementaryTransformationUI', 'hideElementaryTransformationUI'
            ];

            coreFunctions.forEach(funcName => {
                const status = typeof window[funcName] === 'function' ? 'success' : 'error';
                validationResult.coreFunctions.push({ name: funcName, status });
                if (status === 'error') validationResult.overallStatus = 'error';
            });



            // 显示验证结果
            // 转换HTML格式为纯文本格式
            let alertMessage = '网页文件完整性验证结果\n';
            alertMessage += `总体状态：${validationResult.overallStatus === 'success' ? '通过' : '失败'}\n\n`;


            // 脚本文件验证结果
            alertMessage += '脚本文件检查：\n';
            const missingScripts = validationResult.scripts.filter(item => item.status === 'error');
            if (missingScripts.length === 0) {
                alertMessage += '所有脚本文件存在\n';
            } else {
                alertMessage += '缺失的脚本文件：\n';
                missingScripts.forEach(item => {
                    alertMessage += `- ${item.src}\n`;
                });
            }
            alertMessage += '\n';

            // 样式文件验证结果
            alertMessage += '样式文件检查：\n';
            const missingStyles = validationResult.styles.filter(item => item.status === 'error');
            if (missingStyles.length === 0) {
                alertMessage += '所有样式文件存在\n';
            } else {
                alertMessage += '缺失的样式文件：\n';
                missingStyles.forEach(item => {
                    alertMessage += `- ${item.href}\n`;
                });
            }
            alertMessage += '\n';

            // 核心函数验证结果
            alertMessage += '核心函数检查：\n';
            const missingFunctions = validationResult.coreFunctions.filter(item => item.status === 'error');
            if (missingFunctions.length === 0) {
                alertMessage += '所有核心函数存在\n';
            } else {
                alertMessage += '缺失的核心函数：\n';
                missingFunctions.forEach(item => {
                    alertMessage += `- ${item.name}\n`;
                });
            }

            // 使用alert显示验证结果
            alert(alertMessage);
        });
    </script>
</body>

</html>
